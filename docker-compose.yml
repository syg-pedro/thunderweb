services:
  thunderweb:
    build:
      context: .
      dockerfile: ./build/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    links:
      - db
    networks:
      - asgard
    environment:
      APP_DOMAIN: "localhost"
      COOKIE_SECURE: "false"
      SMTP_SECURE: "false"
      SMTP_HOST: mail
      SMTP_PORT: 1025
      DB_NAME: thunderweb
      DB_USER: thor
      DB_PASS: odinson
    volumes:
      - ./etc:/etc/thunderweb
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: thunderweb
      POSTGRES_USER: thor
      POSTGRES_PASSWORD: odinson
    ports:
      - 5432:5432
    volumes:
      - thunderweb_data:/var/lib/postgresql/data
    networks:
      - asgard
  mail:
    image: maildev/maildev:2.1.0
    restart: always
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - asgard

networks:
  asgard:

volumes:
  thunderweb_data:
